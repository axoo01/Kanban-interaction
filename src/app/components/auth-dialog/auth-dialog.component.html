<div class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-header">
      <div class="brand">
        <svg width="24" height="25" xmlns="http://www.w3.org/2000/svg">
          <g fill="#635FC7" fill-rule="evenodd">
            <rect width="6" height="25" rx="2"/>
            <rect opacity=".75" x="9" width="6" height="25" rx="2"/>
            <rect opacity=".5" x="18" width="6" height="25" rx="2"/>
          </g>
        </svg>
        <h2>kanban</h2>
      </div>
      <p class="subtitle">Full-Stack Task Management Platform</p>
    </div>

    <div class="tab-switcher">
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="activeTab() === 'login'" 
        (click)="setTab('login')">
        Sign In
      </button>
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="activeTab() === 'register'" 
        (click)="setTab('register')">
        Create Account
      </button>
    </div>

    @if (errorMessage()) {
      <div class="error-banner">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (activeTab() === 'login') {
      <form (ngSubmit)="onLogin()" class="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input 
            type="email" 
            [(ngModel)]="loginEmail" 
            name="loginEmail" 
            placeholder="e.g. developer@kanban.local" 
            required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input 
            type="password" 
            [(ngModel)]="loginPassword" 
            name="loginPassword" 
            placeholder="••••••••" 
            required />
        </div>

        <button type="submit" class="btn-primary-l submit-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    } @else {
      <form (ngSubmit)="onRegister()" class="auth-form">
        <div class="form-group">
          <label>Full Name</label>
          <input 
            type="text" 
            [(ngModel)]="regFullName" 
            name="regFullName" 
            placeholder="e.g. Jane Doe" 
            required />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input 
            type="email" 
            [(ngModel)]="regEmail" 
            name="regEmail" 
            placeholder="e.g. jane@example.com" 
            required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input 
            type="password" 
            [(ngModel)]="regPassword" 
            name="regPassword" 
            placeholder="Minimum 6 characters" 
            required />
        </div>

        <button type="submit" class="btn-primary-l submit-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Creating Account...' : 'Create Account' }}
        </button>
      </form>
    }

    <div class="divider">
      <span>Or instant demo sign in</span>
    </div>

    <div class="demo-buttons">
      <button 
        type="button" 
        class="demo-btn dev-btn" 
        (click)="onQuickLogin('dev')" 
        [disabled]="isLoading()">
        Sign In as Developer
      </button>

      <button 
        type="button" 
        class="demo-btn admin-btn" 
        (click)="onQuickLogin('admin')" 
        [disabled]="isLoading()">
        Sign In as Admin
      </button>
    </div>
  </div>
</div>
